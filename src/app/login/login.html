<div class="login-card">
  <h2 class="login-title">Login</h2>
  
  <form class="login-form">
    <div class="input-group">
      <div class="input-wrapper">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </span>
        <input 
          type="email" 
          placeholder="Enter your email address"
          class="input-field">
      </div>
    </div>
    
    <div class="input-group">
      <div class="input-wrapper">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </span>
        <input 
          type="password" 
          placeholder="Enter your password"
          class="input-field">
      </div>
    </div>
    <button type="submit" class="login-button">Login</button>

    <div class="store-badges">
      <a href="https://play.google.com/store/search?q=gsas&c=apps&hl=en" class="store-link">
         <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Google_Play_Arrow_logo.svg" class="store-icon" >
       
        <span>Play store</span>
      </a>
      <a href="https://apps.apple.com/us/app/gsas-app/id6449780873" class="store-link">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/67/App_Store_%28iOS%29.svg" class="store-icon">
        <span>Apple store</span>
      </a>
    </div>
  </form>
</div>
